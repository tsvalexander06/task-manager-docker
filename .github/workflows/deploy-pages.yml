name: Deploy Lot Size Calculator to Pages

# Publishes the lot-size-calculator/ folder as the site root, so the app is
# served at https://<owner>.github.io/<repo>/ and installable on mobile.

on:
  push:
    branches:
      - main
      - claude/lot-size-calculator-mobile-5fjeb5
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"   # refresh the economic-calendar snapshot every 2 hours

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages (auto-enable if needed)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Snapshot economic calendar (this week + next week, server-side)
        run: |
          UA="Mozilla/5.0 (compatible; PagesBot)"
          curl -fsS --max-time 30 -A "$UA" "https://nfs.faireconomy.media/ff_calendar_thisweek.json" -o tw.json || echo "" > tw.json
          curl -fsS --max-time 30 -A "$UA" "https://nfs.faireconomy.media/ff_calendar_nextweek.json" -o nw.json || echo "" > nw.json
          if jq -e 'type=="array"' tw.json >/dev/null 2>&1 && jq -e 'type=="array"' nw.json >/dev/null 2>&1; then
            jq -s 'add' tw.json nw.json > lot-size-calculator/calendar.json
          elif jq -e 'type=="array"' tw.json >/dev/null 2>&1; then
            cp tw.json lot-size-calculator/calendar.json
          elif jq -e 'type=="array"' nw.json >/dev/null 2>&1; then
            cp nw.json lot-size-calculator/calendar.json
          else
            echo "[]" > lot-size-calculator/calendar.json
          fi
          echo "calendar.json: $(wc -c < lot-size-calculator/calendar.json) bytes, events: $(jq 'length' lot-size-calculator/calendar.json 2>/dev/null || echo '?')"

      - name: Upload app as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./lot-size-calculator

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
