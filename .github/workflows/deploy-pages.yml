name: Deploy Lot Size Calculator to Pages

# Publishes the lot-size-calculator/ folder as the site root, so the app is
# served at https://<owner>.github.io/<repo>/ and installable on mobile.

on:
  push:
    branches:
      - main
      - claude/lot-size-calculator-mobile-5fjeb5
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"   # refresh the economic-calendar snapshot every 2 hours

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages (auto-enable if needed)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Snapshot economic calendar (server-side, avoids browser CORS)
        run: |
          curl -fsS --max-time 30 -A "Mozilla/5.0 (compatible; PagesBot)" \
            "https://nfs.faireconomy.media/ff_calendar_thisweek.json" \
            -o lot-size-calculator/calendar.json || echo "[]" > lot-size-calculator/calendar.json
          echo "calendar.json: $(wc -c < lot-size-calculator/calendar.json) bytes"

      - name: Upload app as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./lot-size-calculator

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
