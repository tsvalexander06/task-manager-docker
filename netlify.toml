# Netlify — Odyssey Journal
#
# The journal is a single static page, so there is nothing to bundle. The build
# step copies the page into dist/ and writes config.js from the environment.
# Publishing dist/ rather than the source directory keeps the README, the
# going-live checklist and the SQL schema off the public web.

[build]
  base      = "journal"
  publish   = "dist"
  command   = "node scripts/build-config.js"
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    # The page loads Chart.js and the Supabase client from CDNs, talks to
    # Supabase over HTTPS, and renders pasted screenshots as data: URIs.
    # Nothing else should be reachable. 'unsafe-inline' is required because the
    # whole app is one inline script and one inline stylesheet.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.stripe.com; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'"
    X-Frame-Options        = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"

# index.html must never be served stale, or a deploy leaves people on the old
# build. The fingerprinted CDN assets can cache hard.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
